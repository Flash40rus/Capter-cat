<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#2a1f3d">
<title>Каптер: 9 Жизней</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    height:100%; overflow:hidden;
    background:#2a1f3d;
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    touch-action:none; user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  #game { display:block; width:100vw; height:100vh; }
  #hud {
    position:fixed; top:0; left:0; right:0;
    padding:10px 14px; color:#fff;
    display:flex; justify-content:space-between; align-items:center;
    font-size:17px; font-weight:800;
    text-shadow:0 2px 6px rgba(0,0,0,.6);
    pointer-events:none; z-index:10; gap:10px;
  }
  #avatar {
    width:52px; height:52px;
    border-radius:50%;
    border:2px solid #ffb37a;
    box-shadow:0 2px 8px rgba(0,0,0,.5);
    background:#3a2a45; display:block;
  }
  #lives { letter-spacing:1px; font-size:15px; }
  #lives .lost { opacity:.2; }
  #score { font-variant-numeric:tabular-nums; }
  #hint {
    position:fixed; bottom:8px; left:0; right:0;
    text-align:center; color:rgba(255,255,255,.35);
    font-size:11px; pointer-events:none; z-index:10;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <canvas id="avatar" width="104" height="104"></canvas>
  <div id="lives"></div>
  <div id="score">0</div>
</div>
<div id="hint">Клавиша D — показать хитбоксы</div>
<script>
(() => {
'use strict';

// ═══════════════════════════════════════════
//  ПАЛИТРА КОТА
// ═══════════════════════════════════════════
const C = {
  FUR:       '#94876b',
  FUR_DARK:  '#4f4534',
  FUR_LIGHT: '#aaa08a',
  WHITE:     '#faf5eb',
  PINK:      '#e08a8a',
  EAR_PINK:  '#e8a5a5',
  EYE:       '#c8d15a',
  EYE_DARK:  '#1a1a12',
  CLAW:      '#3a3226',
};

// ═══════════════════════════════════════════
//  CANVAS
// ═══════════════════════════════════════════
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, groundY = 0, DPR = 1;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  groundY = H - 96;
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));
resize();

// ═══════════════════════════════════════════
//  КОНСТАНТЫ
// ═══════════════════════════════════════════
const GRAVITY = 0.95;
const JUMP_V = -16.5;
const MAX_JUMPS = 2;
const CAT_W = 110;
const CAT_H = 110;
const HITBOX_FORGIVE = 0.88;

// ═══════════════════════════════════════════
//  СОСТОЯНИЕ
// ═══════════════════════════════════════════
const G = {
  started:false, dead:false, t:0,
  distance:0, score:0, speed:6, lives:9,
  obstacles:[], items:[], particles:[],
  spawnTimer:70, shake:0, invuln:0, bgOffset:0,
};

const cat = {
  x:0, y:0, vy:0, jumps:0,
  sliding:false, slideTimer:0,
  rot:0, sx:1, sy:1,
};

let blinkTimer = 0;
let nextBlink = 90;
let earTwitch = 0;
let nextEarTwitch = 60;
let debugHitboxes = false;

// ═══════════════════════════════════════════
//  RESET
// ═══════════════════════════════════════════
function resetGame() {
  G.started = true; G.dead = false; G.t = 0;
  G.distance = 0; G.score = 0; G.speed = 6; G.lives = 9;
  G.obstacles = []; G.items = []; G.particles = [];
  G.spawnTimer = 70; G.shake = 0; G.invuln = 0;
  cat.x = Math.max(100, W * 0.22);
  cat.y = groundY; cat.vy = 0; cat.jumps = 0;
  cat.sliding = false; cat.slideTimer = 0;
  cat.rot = 0; cat.sx = 1; cat.sy = 1;
  blinkTimer = 0; nextBlink = 90;
  earTwitch = 0; nextEarTwitch = 60;
  updateHUD();
}

// ═══════════════════════════════════════════
//  УПРАВЛЕНИЕ
// ═══════════════════════════════════════════
function jump() {
  if (!G.started || G.dead) return;
  if (cat.jumps < MAX_JUMPS) {
    cat.vy = cat.jumps === 0 ? JUMP_V : JUMP_V * 0.85;
    cat.jumps++;
    cat.sliding = false; cat.slideTimer = 0;
    burst(cat.x, cat.y - 20, '#fff', 6, 1.5);
  }
}

function slide() {
  if (!G.started || G.dead) return;
  cat.sliding = true; cat.slideTimer = 26;
  if (cat.y < groundY - 2) cat.vy = Math.max(cat.vy, 8);
}

let touchY = 0, touchX = 0, touchT = 0;

canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  const t = e.changedTouches[0];
  touchX = t.clientX; touchY = t.clientY; touchT = performance.now();
}, { passive:false });

canvas.addEventListener('touchend', (e) => {
  e.preventDefault();
  const t = e.changedTouches[0];
  const dy = t.clientY - touchY;
  const dx = Math.abs(t.clientX - touchX);
  const dt = performance.now() - touchT;
  if (!G.started || G.dead) { resetGame(); return; }
  if (dy > 36 && dy > dx && dt < 500) slide();
  else jump();
}, { passive:false });

canvas.addEventListener('mousedown', () => {
  if (!G.started || G.dead) resetGame(); else jump();
});

window.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
    e.preventDefault();
    if (!G.started || G.dead) resetGame(); else jump();
  }
  if (e.code === 'ArrowDown' || e.code === 'KeyS') {
    e.preventDefault(); slide();
  }
  if (e.code === 'KeyD') debugHitboxes = !debugHitboxes;
});

// ═══════════════════════════════════════════
//  ХЕЛПЕРЫ
// ═══════════════════════════════════════════
function roundRect(c, x, y, w, h, r) {
  r = Math.min(r, w/2, h/2);
  c.beginPath();
  c.moveTo(x+r, y);
  c.arcTo(x+w, y, x+w, y+h, r);
  c.arcTo(x+w, y+h, x, y+h, r);
  c.arcTo(x, y+h, x, y, r);
  c.arcTo(x, y, x+w, y, r);
  c.closePath();
}

function burst(x, y, color, n, power) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = Math.random() * power + 1;
    G.particles.push({
      x, y,
      vx: Math.cos(a)*s, vy: Math.sin(a)*s - 1,
      life: 30 + Math.random()*20, maxLife: 50,
      color, r: 2 + Math.random()*3,
    });
  }
}

function updateHUD() {
  const el = document.getElementById('lives');
  let html = '';
  for (let i = 0; i < 9; i++)
    html += i < G.lives ? '🐾' : '<span class="lost">🐾</span>';
  el.innerHTML = html;
  document.getElementById('score').textContent =
    String(G.score).padStart(4, '0');
}

function getBlink() {
  if (blinkTimer <= 0) return 0;
  const p = 1 - blinkTimer / 8;
  return Math.sin(p * Math.PI);
}

function circlesHit(a, b) {
  const dx = a.x - b.x, dy = a.y - b.y;
  const r = a.r + b.r;
  return dx*dx + dy*dy < r*r;
}

// ═══════════════════════════════════════════
//  РАНДОМНЫЙ СПАВН
// ═══════════════════════════════════════════
const OBSTACLE_TYPES = [
  { type:'box',      w:52, h:48, level:'ground', weight:12 },
  { type:'pepper',   w:34, h:28, level:'ground', weight:10 },
  { type:'vacuum',   w:64, h:34, level:'ground', weight:10 },
  { type:'cucumber', w:56, h:22, level:'ground', weight:8  },
  { type:'book',     w:48, h:26, level:'ground', weight:8  },
  { type:'bone',     w:40, h:22, level:'ground', weight:6  },
  { type:'slipper',  w:52, h:36, level:'air',    weight:10 },
  { type:'plant',    w:44, h:42, level:'air',    weight:8  },
];

function pickWeighted(list) {
  let total = 0;
  for (const it of list) total += it.weight;
  let r = Math.random() * total;
  for (const it of list) {
    r -= it.weight;
    if (r <= 0) return it;
  }
  return list[0];
}

function buildObstacle(def, xOffset) {
  const scale = 0.85 + Math.random() * 0.45;
  const w = def.w * scale;
  const h = def.h * scale;
  let y;

  if (def.level === 'ground') {
    y = groundY - h;
  } else {
    const variant = Math.random();
    if (variant < 0.5)      y = groundY - 70;
    else if (variant < 0.8) y = groundY - 110 - h;
    else                    y = groundY - 165 - h;
  }

  return {
    type: def.type,
    w, h, y, x: W + 40 + xOffset,
    wobble: Math.random() < 0.15,
    wobblePhase: Math.random() * Math.PI * 2,
    baseY: y,
    hitFlash: 0,
  };
}

function spawnItemPair(offset) {
  const count = Math.random() < 0.35 ? 2 : 1;
  for (let i = 0; i < count; i++) {
    const heights = [groundY - 48, groundY - 90, groundY - 140, groundY - 180];
    const y = heights[Math.floor(Math.random() * heights.length)];
    G.items.push({
      x: W + 90 + offset + Math.random() * 160 + i * 40,
      y, r: 12 + Math.random() * 3,
      collected: false,
      bobPhase: Math.random() * Math.PI * 2,
    });
  }
}

function spawnObstacle() {
  const roll = Math.random();

  if (roll < 0.20 && G.distance > 600) {
    const count = 2 + Math.floor(Math.random() * 2);
    let offset = 0;
    for (let i = 0; i < count; i++) {
      const def = pickWeighted(OBSTACLE_TYPES);
      G.obstacles.push(buildObstacle(def, offset));
      offset += def.w * (1 + Math.random() * 0.6) + 20;
    }
    spawnItemPair(offset + 100);
    return;
  }

  if (roll < 0.35 && G.distance > 1200) {
    const grounds = OBSTACLE_TYPES.filter(d => d.level === 'ground');
    const airs    = OBSTACLE_TYPES.filter(d => d.level === 'air');
    G.obstacles.push(buildObstacle(pickWeighted(grounds), 0));
    G.obstacles.push(buildObstacle(pickWeighted(airs), 180));
    G.obstacles.push(buildObstacle(pickWeighted(grounds), 360));
    spawnItemPair(500);
    return;
  }

  if (roll < 0.45 && G.distance > 2000) {
    for (let i = 0; i < 3; i++) {
      G.obstacles.push(buildObstacle(pickWeighted(OBSTACLE_TYPES), i * 200));
    }
    return;
  }

  const def = pickWeighted(OBSTACLE_TYPES);
  G.obstacles.push(buildObstacle(def, 0));
  if (Math.random() < 0.6) spawnItemPair(0);
}

// ═══════════════════════════════════════════
//  КОЛЛИЗИИ
// ═══════════════════════════════════════════
function getCatHitboxes() {
  const cx = cat.x, by = cat.y;

  if (cat.sliding) {
    return [
      { x: cx - 22, y: by - 12, r: 13 },
      { x: cx,      y: by - 12, r: 13 },
      { x: cx + 22, y: by - 12, r: 13 },
    ];
  }

  const airborne = by < groundY - 2;
  const squash = airborne ? 0.94 : 1;

  return [
    { x: cx + 28, y: by - 76 * squash, r: 14 },
    { x: cx - 3,  y: by - 58 * squash, r: 20 },
    { x: cx - 26, y: by - 48 * squash, r: 14 },
  ];
}

function getObstacleHitboxes(o) {
  switch (o.type) {
    case 'pepper':
    case 'cucumber':
      return [{ x: o.x + o.w/2, y: o.y + o.h/2, r: Math.max(o.w, o.h) * 0.45 }];

    case 'bone':
      return [
        { x: o.x + o.w*0.15, y: o.y + o.h/2, r: o.h * 0.55 },
        { x: o.x + o.w*0.85, y: o.y + o.h/2, r: o.h * 0.55 },
      ];

    case 'vacuum':
      return [
        { x: o.x + o.w*0.30, y: o.y + o.h/2, r: o.h * 0.55 },
        { x: o.x + o.w*0.70, y: o.y + o.h/2, r: o.h * 0.55 },
      ];

    case 'slipper':
    case 'plant':
      return [{ x: o.x + o.w/2, y: o.y + o.h/2, r: Math.min(o.w, o.h) * 0.52 }];

    case 'book':
      return [
        { x: o.x + o.w*0.30, y: o.y + o.h/2, r: o.h * 0.62 },
        { x: o.x + o.w*0.70, y: o.y + o.h/2, r: o.h * 0.62 },
      ];

    case 'box':
    default:
      return [
        { x: o.x + o.w*0.27, y: o.y + o.h/2, r: Math.min(o.w, o.h) * 0.52 },
        { x: o.x + o.w*0.73, y: o.y + o.h/2, r: Math.min(o.w, o.h) * 0.52 },
      ];
  }
}

function checkCollisions() {
  if (G.invuln > 0) return;

  const catBoxes = getCatHitboxes();
  for (const cb of catBoxes) cb.r *= HITBOX_FORGIVE;

  for (const o of G.obstacles) {
    const obs = getObstacleHitboxes(o);
    for (const ob of obs) {
      for (const cb of catBoxes) {
        if (circlesHit(cb, ob)) {
          hit();
          o.hitFlash = 8;
          return;
        }
      }
    }
  }
}

function checkItemPickup() {
  const cx = cat.x, by = cat.y;
  const catCenter = cat.sliding
    ? { x: cx, y: by - 12 }
    : { x: cx, y: by - 58 };
  const pickupR = cat.sliding ? 34 : 44;

  for (const it of G.items) {
    if (it.collected) continue;
    const dx = catCenter.x - it.x;
    const dy = catCenter.y - it.y;
    const rSum = pickupR + it.r;
    if (dx*dx + dy*dy < rSum*rSum) {
      it.collected = true;
      G.distance += 120;
      burst(it.x, it.y, '#f4b942', 8, 2.5);
    }
  }
  G.items = G.items.filter(i => !i.collected);
}

// ═══════════════════════════════════════════
//  UPDATE
// ═══════════════════════════════════════════
function update(dt) {
  G.t += dt;
  G.bgOffset += G.speed * dt * 0.35;

  // мигание
  if (blinkTimer > 0) blinkTimer -= dt;
  else {
    nextBlink -= dt;
    if (nextBlink <= 0) {
      blinkTimer = 8;
      nextBlink = 90 + Math.random() * 240;
    }
  }
  // ухо
  if (earTwitch > 0) earTwitch -= dt;
  else {
    nextEarTwitch -= dt;
    if (nextEarTwitch <= 0) {
      earTwitch = 12;
      nextEarTwitch = 180 + Math.random() * 300;
    }
  }

  if (!G.started || G.dead) { updateParticles(dt); return; }

  G.distance += G.speed * dt;
  G.speed = Math.min(6 + G.distance * 0.0005, 16);
  G.score = Math.floor(G.distance / 8);

  cat.vy += GRAVITY * dt;
  cat.y  += cat.vy * dt;
  if (cat.y >= groundY) { cat.y = groundY; cat.vy = 0; cat.jumps = 0; }

  const airborne = cat.y < groundY - 2;
  const targetRot = airborne
    ? Math.max(-0.22, Math.min(0.22, cat.vy * 0.014))
    : Math.sin(G.t * 0.5) * 0.025;
  cat.rot += (targetRot - cat.rot) * 0.15 * dt;

  const targetSY = cat.sliding ? 0.62 : (airborne ? 1.06 : 1);
  const targetSX = cat.sliding ? 1.20 : (airborne ? 0.95 : 1);
  cat.sy += (targetSY - cat.sy) * 0.22 * dt;
  cat.sx += (targetSX - cat.sx) * 0.22 * dt;

  if (cat.slideTimer > 0) {
    cat.slideTimer -= dt;
    if (cat.slideTimer <= 0) cat.sliding = false;
  }
  if (G.invuln > 0) G.invuln -= dt;

  // спавн
  G.spawnTimer -= dt;
  if (G.spawnTimer <= 0) {
    spawnObstacle();
    const base = Math.max(38, 110 - G.speed * 5.5);
    G.spawnTimer = base * (0.5 + Math.random());
  }

  // движение
  const dx = G.speed * dt;
  for (let i = G.obstacles.length - 1; i >= 0; i--) {
    const o = G.obstacles[i];
    o.x -= dx;
    if (o.wobble) {
      o.wobblePhase += dt * 0.08;
      o.y = o.baseY + Math.sin(o.wobblePhase) * 12;
    }
    if (o.x + o.w < -60) G.obstacles.splice(i, 1);
  }
  for (let i = G.items.length - 1; i >= 0; i--) {
    const it = G.items[i];
    it.x -= dx;
    if (it.x < -60) G.items.splice(i, 1);
  }

  // коллизии
  checkCollisions();
  checkItemPickup();

  // вспышка
  for (const o of G.obstacles) if (o.hitFlash > 0) o.hitFlash -= dt;

  updateParticles(dt);
  if (G.shake > 0) G.shake -= dt;
  updateHUD();
}

function hit() {
  G.lives--; G.invuln = 100; G.shake = 18;
  burst(cat.x, cat.y - 30, '#ff5a5a', 14, 3);
  updateHUD();
  if (G.lives <= 0) { G.dead = true; G.lives = 0; updateHUD(); }
}

function updateParticles(dt) {
  for (let i = G.particles.length - 1; i >= 0; i--) {
    const p = G.particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 0.35 * dt;
    p.life -= dt;
    if (p.life <= 0) G.particles.splice(i, 1);
  }
}

// ═══════════════════════════════════════════
//  ФОН
// ═══════════════════════════════════════════
function drawBackground() {
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#2a1f3d');
  grad.addColorStop(0.55, '#4a2f45');
  grad.addColorStop(1, '#6b3f3a');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.globalAlpha = 0.12;
  ctx.fillStyle = '#ffb37a';
  const off = G.bgOffset * 0.25;
  for (let i = 0; i < 8; i++) {
    const bx = ((i*220 - off) % (W + 400)) - 200;
    const bh = 90 + (i % 3) * 45;
    roundRect(ctx, bx, groundY - bh - 40, 130, bh, 10);
    ctx.fill();
  }
  ctx.restore();

  ctx.save();
  ctx.globalAlpha = 0.08;
  ctx.fillStyle = '#000';
  const off2 = G.bgOffset * 0.6;
  for (let i = 0; i < 12; i++) {
    const bx = ((i*160 - off2) % (W + 320)) - 160;
    ctx.fillRect(bx, groundY - 60, 8, 60);
  }
  ctx.restore();
}

function drawGround() {
  const g = ctx.createLinearGradient(0, groundY, 0, H);
  g.addColorStop(0, '#7a4a34');
  g.addColorStop(1, '#4a2a1e');
  ctx.fillStyle = g;
  ctx.fillRect(0, groundY, W, H - groundY);

  ctx.fillStyle = '#a86a44';
  ctx.fillRect(0, groundY, W, 5);

  ctx.save();
  ctx.globalAlpha = 0.18;
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 2;
  const off = G.bgOffset % 90;
  for (let x = -off; x < W + 90; x += 90) {
    ctx.beginPath();
    ctx.moveTo(x, groundY + 8);
    ctx.lineTo(x - 30, H);
    ctx.stroke();
  }
  ctx.restore();
}

// ═══════════════════════════════════════════
//  ПРЕПЯТСТВИЯ
// ═══════════════════════════════════════════
function drawObstacle(o) {
  ctx.save();

  // вспышка (за препятствием)
  if (o.hitFlash > 0) {
    ctx.globalAlpha = o.hitFlash / 8 * 0.6;
    ctx.fillStyle = '#ff2222';
    roundRect(ctx, o.x - 4, o.y - 4, o.w + 8, o.h + 8, 6);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  // тень на земле
  ctx.fillStyle = 'rgba(0,0,0,0.22)';
  ctx.beginPath();
  ctx.ellipse(o.x + o.w/2, groundY + 3, o.w*0.5, 5, 0, 0, Math.PI*2);
  ctx.fill();

  if (o.type === 'box') {
    ctx.fillStyle = '#c94a1e';
    roundRect(ctx, o.x, o.y + 3, o.w, o.h, 7); ctx.fill();
    ctx.fillStyle = '#e35d2a';
    roundRect(ctx, o.x, o.y, o.w, o.h, 7); ctx.fill();
    ctx.fillStyle = '#ff8a55';
    roundRect(ctx, o.x+4, o.y+4, o.w-8, o.h*0.32, 4); ctx.fill();
    ctx.fillStyle = '#a83a14';
    ctx.fillRect(o.x+7, o.y + o.h*0.55, o.w-14, 3);

  } else if (o.type === 'pepper') {
    ctx.fillStyle = '#3f7a30';
    ctx.beginPath();
    ctx.ellipse(o.x+o.w/2+1, o.y+o.h/2+2, o.w/2, o.h/2, -0.35, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#5aa83f';
    ctx.beginPath();
    ctx.ellipse(o.x+o.w/2, o.y+o.h/2, o.w/2, o.h/2, -0.35, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#8fd96a';
    ctx.beginPath();
    ctx.ellipse(o.x+o.w/2-4, o.y+o.h/2-4, o.w/5, o.h/6, -0.35, 0, Math.PI*2);
    ctx.fill();

  } else if (o.type === 'vacuum') {
    ctx.fillStyle = '#23232c';
    roundRect(ctx, o.x, o.y, o.w, o.h, o.h/2); ctx.fill();
    ctx.fillStyle = '#3a3a4a';
    roundRect(ctx, o.x+4, o.y+4, o.w-8, o.h-10, (o.h-10)/2); ctx.fill();
    ctx.fillStyle = '#6a6a85';
    ctx.beginPath();
    ctx.arc(o.x+o.w/2, o.y+o.h/2, o.h*0.26, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#ff4a4a';
    ctx.beginPath();
    ctx.arc(o.x+o.w/2, o.y+o.h*0.32, 3, 0, Math.PI*2);
    ctx.fill();

  } else if (o.type === 'slipper') {
    ctx.fillStyle = '#8c3e3a';
    ctx.beginPath();
    ctx.ellipse(o.x+o.w/2+2, o.y+o.h/2+3, o.w/2, o.h/2, -0.2, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#b8544f';
    ctx.beginPath();
    ctx.ellipse(o.x+o.w/2, o.y+o.h/2, o.w/2, o.h/2, -0.2, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#d97070';
    ctx.beginPath();
    ctx.ellipse(o.x+o.w/2-8, o.y+o.h/2-2, o.w/3.5, o.h/3.5, -0.2, 0, Math.PI*2);
    ctx.fill();

  } else if (o.type === 'cucumber') {
    ctx.fillStyle = '#3d7a28';
    roundRect(ctx, o.x, o.y, o.w, o.h, o.h/2); ctx.fill();
    ctx.fillStyle = '#5aa83f';
    roundRect(ctx, o.x + 2, o.y + 1, o.w - 4, o.h - 4, o.h/2); ctx.fill();
    ctx.fillStyle = '#8fd96a';
    ctx.beginPath();
    ctx.ellipse(o.x + o.w * 0.3, o.y + o.h * 0.35, o.w * 0.25, o.h * 0.1, -0.2, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#2f5d1e';
    for (let i = 0; i < 5; i++) {
      const px = o.x + 8 + i * (o.w - 16) / 4;
      const py = o.y + (i % 2 ? o.h * 0.7 : o.h * 0.35);
      ctx.beginPath();
      ctx.arc(px, py, 1.5, 0, Math.PI*2);
      ctx.fill();
    }

  } else if (o.type === 'book') {
    ctx.fillStyle = '#8b1e1e';
    roundRect(ctx, o.x, o.y, o.w, o.h, 3); ctx.fill();
    ctx.fillStyle = '#f0e3c8';
    ctx.fillRect(o.x + o.w - 5, o.y + 2, 3, o.h - 4);
    ctx.fillStyle = '#c9b48a';
    for (let i = 1; i < 4; i++) {
      ctx.fillRect(o.x + 3, o.y + i * o.h / 4, o.w - 12, 1);
    }
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.fillRect(o.x + 4, o.y + 3, o.w - 14, 3);

  } else if (o.type === 'bone') {
    ctx.fillStyle = '#e8e0c8';
    ctx.beginPath();
    ctx.arc(o.x + 6, o.y + o.h * 0.35, 6, 0, Math.PI*2); ctx.fill();
    ctx.beginPath();
    ctx.arc(o.x + 6, o.y + o.h * 0.65, 6, 0, Math.PI*2); ctx.fill();
    ctx.beginPath();
    ctx.arc(o.x + o.w - 6, o.y + o.h * 0.35, 6, 0, Math.PI*2); ctx.fill();
    ctx.beginPath();
    ctx.arc(o.x + o.w - 6, o.y + o.h * 0.65, 6, 0, Math.PI*2); ctx.fill();
    ctx.fillRect(o.x + 4, o.y + o.h * 0.35, o.w - 8, o.h * 0.30);
    ctx.fillStyle = 'rgba(0,0,0,0.15)';
    ctx.fillRect(o.x + 6, o.y + o.h * 0.55, o.w - 12, 2);

  } else if (o.type === 'plant') {
    ctx.fillStyle = '#a0522d';
    ctx.beginPath();
    ctx.moveTo(o.x + 4, o.y + o.h * 0.5);
    ctx.lineTo(o.x + o.w - 4, o.y + o.h * 0.5);
    ctx.lineTo(o.x + o.w - 8, o.y + o.h);
    ctx.lineTo(o.x + 8, o.y + o.h);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#7a3a1e';
    ctx.fillRect(o.x + 2, o.y + o.h * 0.45, o.w - 4, 6);
    ctx.fillStyle = '#3a8a3a';
    for (let i = 0; i < 5; i++) {
      const a = -Math.PI/2 + (i - 2) * 0.5;
      const lx = o.x + o.w / 2;
      const ly = o.y + o.h * 0.45;
      ctx.beginPath();
      ctx.ellipse(lx + Math.cos(a) * 12, ly + Math.sin(a) * 14,
                  7, 4, a, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.fillStyle = '#5ab85a';
    ctx.beginPath();
    ctx.ellipse(o.x + o.w / 2, o.y + o.h * 0.35, 6, 5, 0, 0, Math.PI*2);
    ctx.fill();
  }

  // белая обводка при попадании
  if (o.hitFlash > 0) {
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.globalAlpha = o.hitFlash / 8;
    roundRect(ctx, o.x - 2, o.y - 2, o.w + 4, o.h + 4, 5);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  ctx.restore();
}

// ═══════════════════════════════════════════
//  РЫБКА
// ═══════════════════════════════════════════
function drawFish(it) {
  ctx.save();
  ctx.translate(it.x, it.y);
  const bob = Math.sin(G.t * 0.09 + (it.bobPhase || 0)) * 3;
  ctx.translate(0, bob);

  ctx.globalAlpha = 0.25;
  ctx.fillStyle = '#ffd66b';
  ctx.beginPath();
  ctx.arc(0, 0, it.r * 1.8, 0, Math.PI*2);
  ctx.fill();
  ctx.globalAlpha = 1;

  const r = it.r;
  ctx.fillStyle = '#e0a52e';
  ctx.beginPath();
  ctx.moveTo(-r*0.8, 0);
  ctx.lineTo(-r*1.6, -r*0.7);
  ctx.lineTo(-r*1.6, r*0.7);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = '#f4b942';
  ctx.beginPath();
  ctx.ellipse(0, 0, r, r*0.68, 0, 0, Math.PI*2);
  ctx.fill();

  ctx.fillStyle = '#ffe08a';
  ctx.beginPath();
  ctx.ellipse(0, -r*0.15, r*0.6, r*0.25, 0, 0, Math.PI*2);
  ctx.fill();

  ctx.fillStyle = '#2b2b1e';
  ctx.beginPath();
  ctx.arc(r*0.45, -r*0.1, r*0.14, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
}

// ═══════════════════════════════════════════
//  КОТ — РИСОВАНИЕ
// ═══════════════════════════════════════════
function drawCat() {
  const cx = cat.x, by = cat.y, t = G.t;
  const airborne = cat.y < groundY - 2;

  if (G.invuln > 0 && Math.floor(t/4) % 2 === 0) return;

  // тень
  ctx.fillStyle = 'rgba(0,0,0,0.30)';
  ctx.beginPath();
  const shScale = Math.max(0.4, 1 - (groundY - by)/400);
  ctx.ellipse(cx, groundY + 5, CAT_W*0.40*shScale, 7*shScale, 0, 0, Math.PI*2);
  ctx.fill();

  ctx.save();
  ctx.translate(cx, by);

  const bob = (!airborne && !cat.sliding) ? Math.sin(t * 0.55) * 2.5 : 0;
  ctx.translate(0, bob);

  ctx.rotate(cat.rot);
  ctx.scale(cat.sx, cat.sy);
  ctx.translate(5, 0);

  drawCatBody(t, airborne, cat.sliding);

  ctx.restore();
}

function drawCatBody(t, airborne, sliding) {
  const bodyTop = -78, bodyBot = -34;
  const bodyL = -38, bodyR = 32;
  const bodyCX = (bodyL + bodyR) / 2;
  const bodyCY = (bodyTop + bodyBot) / 2;
  const bodyRW = (bodyR - bodyL) / 2;
  const bodyRH = (bodyBot - bodyTop) / 2;

  const legPhase = t * 0.42;

  // дальние лапы
  if (airborne) {
    drawLeg(-22, -44, -14, 0, true, C.FUR_DARK);
    drawLeg( 14, -44, -10, 0, true, C.FUR_DARK);
  } else if (sliding) {
    drawLeg(-26, -30, -8, 0, true, C.FUR_DARK);
    drawLeg(  8, -30, -8, 0, true, C.FUR_DARK);
  } else {
    drawLeg(-24, bodyBot, 0, legPhase, true, C.FUR_DARK);
    drawLeg( 12, bodyBot, 0, legPhase + Math.PI, true, C.FUR_DARK);
  }

  // хвост
  drawCatTail(t, airborne, sliding);

  // тело
  ctx.fillStyle = C.FUR;
  ctx.beginPath();
  ctx.ellipse(bodyCX, bodyCY, bodyRW, bodyRH, 0, 0, Math.PI*2);
  ctx.fill();

  // полоски
  ctx.save();
  ctx.beginPath();
  ctx.ellipse(bodyCX, bodyCY, bodyRW, bodyRH, 0, 0, Math.PI*2);
  ctx.clip();
  ctx.strokeStyle = C.FUR_DARK;
  ctx.lineWidth = 4;
  ctx.lineCap = 'round';
  for (let i = 0; i < 4; i++) {
    const sx = bodyL + 10 + i * 14;
    ctx.beginPath();
    ctx.moveTo(sx, bodyTop);
    ctx.quadraticCurveTo(sx + 4, bodyCY, sx - 2, bodyBot);
    ctx.stroke();
  }
  ctx.restore();

  // белая грудка
  ctx.fillStyle = C.WHITE;
  ctx.beginPath();
  ctx.ellipse(bodyR - 6, bodyCY + 8, bodyRW * 0.44, bodyRH * 0.55, -0.15, 0, Math.PI*2);
  ctx.fill();

  // ближние лапы
  if (airborne) {
    drawLeg(-14, -42, -12, 0, false, C.FUR);
    drawLeg( 20, -42, -8, 0, false, C.FUR);
  } else if (sliding) {
    drawLeg(-16, -30, -8, 0, false, C.FUR);
    drawLeg( 20, -30, -8, 0, false, C.FUR);
  } else {
    drawLeg(-14, bodyBot, 0, legPhase + Math.PI, false, C.FUR);
    drawLeg( 20, bodyBot, 0, legPhase, false, C.FUR);
  }

  // голова
  drawHead(42, -86, 20, t);
}

function drawLeg(x, yTop, yBot, phase, isFar, color) {
  const swing = Math.sin(phase) * 7;
  const lift  = Math.max(0, Math.sin(phase)) * 4;

  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = isFar ? 8 : 10;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  const midX = x + swing * 0.4;
  const midY = (yTop + yBot) / 2;
  const endX = x + swing;
  const endY = yBot - lift;

  ctx.beginPath();
  ctx.moveTo(x, yTop);
  ctx.lineTo(midX, midY);
  ctx.lineTo(endX, endY);
  ctx.stroke();

  ctx.fillStyle = C.WHITE;
  ctx.beginPath();
  ctx.ellipse(endX, endY, 7, 4, 0, 0, Math.PI*2);
  ctx.fill();

  if (lift > 1) {
    ctx.strokeStyle = C.CLAW;
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let k = -1; k <= 1; k++) {
      ctx.moveTo(endX + k * 2, endY + 1);
      ctx.lineTo(endX + k * 2 + 1, endY + 4);
    }
    ctx.stroke();
  }
  ctx.restore();
}

function drawCatTail(t, airborne, sliding) {
  const rootX = -38;
  const rootY = sliding ? -40 : -70;
  const baseAngle = airborne ? -1.35 : (sliding ? -0.7 : -0.85);
  const segCount = 8, segLen = 11;
  const wagSpeed = 0.25;
  const wagAmp = airborne ? 0.6 : 0.45;

  ctx.save();
  ctx.strokeStyle = C.FUR;
  ctx.lineWidth = 14;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  const points = [[rootX, rootY]];
  let px = rootX, py = rootY;

  ctx.beginPath();
  ctx.moveTo(px, py);
  for (let i = 1; i <= segCount; i++) {
    const seg = i / segCount;
    const a = baseAngle + Math.sin(t * wagSpeed - seg * 1.5) * wagAmp * seg;
    const nx = px + Math.cos(a) * segLen;
    const ny = py + Math.sin(a) * segLen;
    ctx.lineTo(nx, ny);
    px = nx; py = ny;
    points.push([px, py]);
  }
  ctx.stroke();

  // тёмные кольца
  ctx.strokeStyle = C.FUR_DARK;
  ctx.lineWidth = 3.5;
  for (let i = 2; i < points.length - 1; i += 2) {
    const [x1, y1] = points[i];
    const [x2, y2] = points[i + 1] || points[i];
    const a = Math.atan2(y2 - y1, x2 - x1);
    ctx.beginPath();
    ctx.moveTo(x1 + Math.cos(a + Math.PI/2) * 6, y1 + Math.sin(a + Math.PI/2) * 6);
    ctx.lineTo(x1 - Math.cos(a + Math.PI/2) * 6, y1 - Math.sin(a + Math.PI/2) * 6);
    ctx.stroke();
  }

  // белый кончик
  const [endX, endY] = points[points.length - 1];
  ctx.fillStyle = C.WHITE;
  ctx.beginPath();
  ctx.arc(endX, endY, 8, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
}

function drawHead(cx, cy, r, t) {
  const twitch = earTwitch > 0
    ? Math.sin((1 - earTwitch/12) * Math.PI * 3) * 0.12
    : 0;
  const headBob = Math.sin(t * 0.55) * 1.2;

  ctx.save();
  ctx.translate(0, headBob);

  // левое ухо
  ctx.save();
  ctx.translate(cx - 12, cy - 18);
  ctx.rotate(twitch * 0.8);
  ctx.translate(-(cx - 12), -(cy - 18));
  ctx.fillStyle = C.FUR;
  ctx.beginPath();
  ctx.moveTo(cx - 17, cy - 6);
  ctx.lineTo(cx - 15, cy - 32);
  ctx.lineTo(cx - 1, cy - 14);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = C.EAR_PINK;
  ctx.beginPath();
  ctx.moveTo(cx - 14, cy - 11);
  ctx.lineTo(cx - 13, cy - 27);
  ctx.lineTo(cx - 4, cy - 14);
  ctx.closePath(); ctx.fill();
  ctx.restore();

  // правое ухо
  ctx.save();
  ctx.translate(cx + 10, cy - 18);
  ctx.rotate(twitch);
  ctx.translate(-(cx + 10), -(cy - 18));
  ctx.fillStyle = C.FUR;
  ctx.beginPath();
  ctx.moveTo(cx + 3, cy - 14);
  ctx.lineTo(cx + 14, cy - 32);
  ctx.lineTo(cx + 17, cy - 6);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = C.EAR_PINK;
  ctx.beginPath();
  ctx.moveTo(cx + 6, cy - 13);
  ctx.lineTo(cx + 13, cy - 27);
  ctx.lineTo(cx + 14, cy - 11);
  ctx.closePath(); ctx.fill();
  ctx.restore();

  // голова
  ctx.fillStyle = C.FUR;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI*2);
  ctx.fill();

  // полоски на лбу
  ctx.strokeStyle = C.FUR_DARK;
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(cx - 6, cy - r + 4); ctx.lineTo(cx - 6, cy - r + 12);
  ctx.moveTo(cx,     cy - r + 2); ctx.lineTo(cx,     cy - r + 12);
  ctx.moveTo(cx + 6, cy - r + 4); ctx.lineTo(cx + 6, cy - r + 12);
  ctx.stroke();

  // белая мордашка
  ctx.fillStyle = C.WHITE;
  ctx.beginPath();
  ctx.ellipse(cx + 2, cy + 8, 13, 9, 0, 0, Math.PI*2);
  ctx.fill();

  // глаза
  const blinkAmt = getBlink();
  const eyeY = cy - 2;
  const eyeLX = cx - 7;
  const eyeRX = cx + 7;
  const eyeR = 6;

  if (blinkAmt > 0.3) {
    ctx.strokeStyle = C.EYE_DARK;
    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(eyeLX - 5, eyeY); ctx.lineTo(eyeLX + 5, eyeY);
    ctx.moveTo(eyeRX - 5, eyeY); ctx.lineTo(eyeRX + 5, eyeY);
    ctx.stroke();
  } else {
    ctx.fillStyle = C.EYE;
    ctx.beginPath();
    ctx.arc(eyeLX, eyeY, eyeR, 0, Math.PI*2);
    ctx.arc(eyeRX, eyeY, eyeR, 0, Math.PI*2);
    ctx.fill();

    ctx.fillStyle = C.EYE_DARK;
    const pupilH = eyeR * 1.7 * (1 - blinkAmt * 0.7);
    ctx.beginPath();
    ctx.ellipse(eyeLX, eyeY, eyeR * 0.55, pupilH / 2, 0, 0, Math.PI*2);
    ctx.ellipse(eyeRX, eyeY, eyeR * 0.55, pupilH / 2, 0, 0, Math.PI*2);
    ctx.fill();

    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(eyeLX - 2, eyeY - 2.5, 1.8, 0, Math.PI*2);
    ctx.arc(eyeRX - 2, eyeY - 2.5, 1.8, 0, Math.PI*2);
    ctx.fill();
  }

  // нос
  ctx.fillStyle = C.PINK;
  ctx.beginPath();
  ctx.moveTo(cx + 2, cy + 5);
  ctx.lineTo(cx + 7, cy + 5);
  ctx.lineTo(cx + 4.5, cy + 8);
  ctx.closePath(); ctx.fill();

  // рот
  ctx.strokeStyle = C.EYE_DARK;
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(cx + 4.5, cy + 8);
  ctx.lineTo(cx + 4.5, cy + 10);
  ctx.quadraticCurveTo(cx + 1, cy + 12, cx - 1, cy + 10);
  ctx.moveTo(cx + 4.5, cy + 10);
  ctx.quadraticCurveTo(cx + 8, cy + 12, cx + 10, cy + 10);
  ctx.stroke();

  // усы
  ctx.strokeStyle = 'rgba(255,255,255,0.9)';
  ctx.lineWidth = 1.2;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(cx - 10, cy + 6); ctx.lineTo(cx - 26, cy + 2);
  ctx.moveTo(cx - 10, cy + 8); ctx.lineTo(cx - 26, cy + 10);
  ctx.moveTo(cx + 14, cy + 6); ctx.lineTo(cx + 30, cy + 2);
  ctx.moveTo(cx + 14, cy + 8); ctx.lineTo(cx + 30, cy + 10);
  ctx.stroke();

  ctx.restore();
}

// ═══════════════════════════════════════════
//  DEBUG-ХИТБОКСЫ
// ═══════════════════════════════════════════
function drawHitboxes() {
  if (!debugHitboxes) return;
  ctx.save();

  if (G.started && !G.dead) {
    const cbs = getCatHitboxes();
    for (const cb of cbs) cb.r *= HITBOX_FORGIVE;
    ctx.strokeStyle = '#00ff88';
    ctx.lineWidth = 2;
    for (const cb of cbs) {
      ctx.beginPath();
      ctx.arc(cb.x, cb.y, cb.r, 0, Math.PI*2);
      ctx.stroke();
    }
  }

  ctx.strokeStyle = '#ff3355';
  ctx.lineWidth = 2;
  for (const o of G.obstacles) {
    for (const ob of getObstacleHitboxes(o)) {
      ctx.beginPath();
      ctx.arc(ob.x, ob.y, ob.r, 0, Math.PI*2);
      ctx.stroke();
    }
  }

  ctx.strokeStyle = '#ffdd55';
  for (const it of G.items) {
    ctx.beginPath();
    ctx.arc(it.x, it.y, it.r, 0, Math.PI*2);
    ctx.stroke();
  }

  ctx.restore();
}

function drawAvatar() {
  const av = document.getElementById('avatar');
  const c = av.getContext('2d');
  c.setTransform(2, 0, 0, 2, 0, 0);

  c.fillStyle = '#3a2a45';
  c.fillRect(0, 0, 52, 52);

  c.save();
  c.translate(26, 30);
  c.scale(0.95, 0.95);

  c.fillStyle = C.FUR;
  c.beginPath();
  c.moveTo(-12, -8); c.lineTo(-11, -26); c.lineTo(0, -12); c.closePath(); c.fill();
  c.beginPath();
  c.moveTo(4, -12); c.lineTo(13, -26); c.lineTo(14, -8); c.closePath(); c.fill();
  c.fillStyle = C.EAR_PINK;
  c.beginPath();
  c.moveTo(-10, -12); c.lineTo(-9, -22); c.lineTo(-2, -13); c.closePath(); c.fill();
  c.beginPath();
  c.moveTo(6, -13); c.lineTo(12, -22); c.lineTo(12, -12); c.closePath(); c.fill();

  c.fillStyle = C.FUR;
  c.beginPath(); c.arc(0, 0, 15, 0, Math.PI*2); c.fill();

  c.strokeStyle = C.FUR_DARK; c.lineWidth = 2.5; c.lineCap = 'round';
  c.beginPath();
  c.moveTo(-5, -14); c.lineTo(-5, -7);
  c.moveTo(0, -15); c.lineTo(0, -7);
  c.moveTo(5, -14); c.lineTo(5, -7);
  c.stroke();

  c.fillStyle = C.WHITE;
  c.beginPath(); c.ellipse(0, 7, 10, 7, 0, 0, Math.PI*2); c.fill();

  c.fillStyle = C.EYE;
  c.beginPath();
  c.arc(-5, -1, 4, 0, Math.PI*2);
  c.arc(5, -1, 4, 0, Math.PI*2);
  c.fill();
  c.fillStyle = C.EYE_DARK;
  c.beginPath();
  c.ellipse(-5, -1, 2.2, 3.4, 0, 0, Math.PI*2);
  c.ellipse(5, -1, 2.2, 3.4, 0, 0, Math.PI*2);
  c.fill();
  c.fillStyle = '#fff';
  c.beginPath();
  c.arc(-6, -2.5, 1.3, 0, Math.PI*2);
  c.arc(4, -2.5, 1.3, 0, Math.PI*2);
  c.fill();

  c.fillStyle = C.PINK;
  c.beginPath();
  c.moveTo(-1, 4); c.lineTo(3, 4); c.lineTo(1, 6.5); c.closePath(); c.fill();

  c.restore();
}

// ═══════════════════════════════════════════
//  ЧАСТИЦЫ
// ═══════════════════════════════════════════
function drawParticles() {
  for (const p of G.particles) {
    ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ═══════════════════════════════════════════
//  ЭКРАНЫ
// ═══════════════════════════════════════════
function drawCatPreview(cx, cy, scale, t) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(scale, scale);
  ctx.translate(5, 0);
  drawCatBody(t, false, false);
  ctx.restore();
}

function drawStartScreen() {
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(0, 0, W, H);

  const scale = Math.min(W / 380, 1.4);
  drawCatPreview(W/2, H * 0.32 + 40 * scale, scale, G.t);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 40px -apple-system, sans-serif';
  ctx.fillText('КАПТЕР', W/2, H * 0.45);

  ctx.font = 'bold 24px -apple-system, sans-serif';
  ctx.fillStyle = '#ffb37a';
  ctx.fillText('9 ЖИЗНЕЙ', W/2, H * 0.5);

  ctx.font = '16px -apple-system, sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.fillText('ТАП — прыжок / двойной прыжок', W/2, H * 0.58);
  ctx.fillText('СВАЙП ВНИЗ — подкат', W/2, H * 0.62);
  ctx.fillText('Собирай 🐟, уворачивайся!', W/2, H * 0.665);

  const pulse = 1 + Math.sin(G.t * 0.1) * 0.05;
  ctx.save();
  ctx.translate(W/2, H * 0.80);
  ctx.scale(pulse, pulse);
  ctx.fillStyle = '#ffb37a';
  roundRect(ctx, -110, -28, 220, 56, 28); ctx.fill();
  ctx.fillStyle = '#2a1f3d';
  ctx.font = 'bold 20px -apple-system, sans-serif';
  ctx.fillText('ТАПНИ ЧТОБЫ НАЧАТЬ', 0, 7);
  ctx.restore();
  ctx.textAlign = 'left';
}

function drawGameOver() {
  ctx.fillStyle = 'rgba(0,0,0,0.65)';
  ctx.fillRect(0, 0, W, H);

  const scale = Math.min(W / 500, 1.0);
  drawCatPreview(W/2, H * 0.28 + 40 * scale, scale, G.t);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#ff5a5a';
  ctx.font = 'bold 34px -apple-system, sans-serif';
  ctx.fillText('КАПТЕР УСТАЛ', W/2, H * 0.42);

  ctx.fillStyle = '#fff';
  ctx.font = 'bold 18px -apple-system, sans-serif';
  ctx.fillText('Все 9 жизней истрачены', W/2, H * 0.475);

  ctx.fillStyle = '#ffb37a';
  ctx.font = 'bold 34px -apple-system, sans-serif';
  ctx.fillText(String(G.score), W/2, H * 0.56);

  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.font = '14px -apple-system, sans-serif';
  ctx.fillText('ОЧКОВ', W/2, H * 0.60);

  const pulse = 1 + Math.sin(G.t * 0.12) * 0.05;
  ctx.save();
  ctx.translate(W/2, H * 0.78);
  ctx.scale(pulse, pulse);
  ctx.fillStyle = '#ffb37a';
  roundRect(ctx, -110, -28, 220, 56, 28); ctx.fill();
  ctx.fillStyle = '#2a1f3d';
  ctx.font = 'bold 20px -apple-system, sans-serif';
  ctx.fillText('ЕЩЁ РАЗ', 0, 7);
  ctx.restore();
  ctx.textAlign = 'left';
}

// ═══════════════════════════════════════════
//  ГЛАВНЫЙ РЕНДЕР
// ═══════════════════════════════════════════
function render() {
  ctx.save();
  if (G.shake > 0) {
    const s = G.shake;
    ctx.translate((Math.random()-0.5)*s, (Math.random()-0.5)*s);
  }

  drawBackground();
  drawGround();

  for (const it of G.items) drawFish(it);
  for (const o of G.obstacles) drawObstacle(o);

  if (G.started && !G.dead) drawCat();

  drawParticles();
  drawHitboxes();
  ctx.restore();

  if (!G.started) drawStartScreen();
  if (G.dead)     drawGameOver();
}

// ═══════════════════════════════════════════
//  ЦИКЛ
// ═══════════════════════════════════════════
let lastT = performance.now();
function loop(now) {
  const dt = Math.min((now - lastT) / 16.667, 2.5);
  lastT = now;
  update(dt);
  render();
  requestAnimationFrame(loop);
}

cat.x = Math.max(100, W * 0.22);
cat.y = groundY;
updateHUD();
drawAvatar();
requestAnimationFrame(loop);

})();
</script>
</body>
</html>
